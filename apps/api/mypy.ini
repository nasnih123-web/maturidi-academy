# mypy config — آکادمی ماتریدی (API)
#
# فقط overrideهای per-module برای کتابخانه‌های ثالثی که stub/py.typed ندارند
# یا وابستگی اختیاریِ نصب‌نشده‌اند. هیچ error codeای به‌صورت سراسری خاموش
# نشده است؛ بدنهٔ کد با تنظیمات پیش‌فرض سخت‌گیرانهٔ mypy چک می‌شود.
[mypy]
python_version = 3.14

# telethon (فاز ۱۱): نصب است ولی py.typed/stub ندارد → import-untyped.
[mypy-telethon]
ignore_missing_imports = True

[mypy-telethon.*]
ignore_missing_imports = True

# arabic-reshaper و python-bidi (فاز ۸، PDF گواهی): stub/py.typed ندارند.
[mypy-arabic_reshaper]
ignore_missing_imports = True

[mypy-bidi]
ignore_missing_imports = True

[mypy-bidi.*]
ignore_missing_imports = True

# faster-whisper (فاز ۱۲، STT): وابستگی اختیاری — در محیط dev/CI نصب نیست
# و stub هم ندارد؛ ایمپورت در app/modules/voice/stt.py تنبل (lazy) است.
[mypy-faster_whisper]
ignore_missing_imports = True

# sentence-transformers (فاز ۶، embedding محلی): وابستگی اختیاری سنگین،
# نصب نیست و stub ندارد؛ ایمپورت در embeddings.py تنبل است.
[mypy-sentence_transformers]
ignore_missing_imports = True

# pgvector (فاز ۶، جست‌وجوی معنایی): کلاینت اختیاری؛ در این محیط نصب نیست.
[mypy-pgvector]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True
