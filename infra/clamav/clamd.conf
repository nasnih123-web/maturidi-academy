# Custom clamd configuration for the Maturidi Academy Railway deployment.
#
# Why this file exists: with the stock clamav/clamav image on Railway,
# clamd never produced a socket and failed silently at every 30-minute
# entrypoint cycle ("Failed to start clamd", with no clamd output anywhere
# in the deployment logs). This configuration:
#   - makes clamd log to stdout/stderr (no LogFile, no LogSyslog), so a
#     foreground clamd's own errors become visible in Railway logs;
#   - explicitly enables TCP listening on 3310 (required by the API
#     service, which connects over Railway private networking);
#   - keeps the local socket at /tmp/clamd.sock (the image default, which
#     the entrypoint's wait loop and freshclam's notify path expect);
#   - raises the per-stream limit above the stock image default (25 MB)
#     to 200 MB, comfortably above the academy's current media (the
#     promo video is ~5 MB) while keeping worst-case memory
#     (stream + signature database) inside the service's 1 GB cap.
#
# NOTE: never add an uncommented "Example" line to this file — clamd
# refuses to start while one is present.

DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
# No TCPAddr: bind all interfaces (dual-stack), as required for Railway
# private networking (clamav.railway.internal).
# No LogFile and no LogSyslog: with --foreground, clamd logs to
# stdout/stderr, which Railway captures as deployment logs.
LogTime yes
User clamav
Foreground yes
StreamMaxLength 200M
MaxScanSize 400M
MaxFileSize 400M
