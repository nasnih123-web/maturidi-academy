# فاز ۲ — جمع‌آوری متریک‌ها (+ m-02: قوانین هشدار و exporterها)
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "maturidi-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
