<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
  <!-- Image frame with corner ornaments: double rule + 8-point stars on corners -->
  <rect x="8" y="8" width="224" height="284" rx="3"/>
  <rect x="22" y="22" width="196" height="256" rx="2"/>
  <g id="corner-star">
    <rect x="-7" y="-7" width="14" height="14"/>
    <rect x="-7" y="-7" width="14" height="14" transform="rotate(45)"/>
  </g>
  <use href="#corner-star" x="8" y="8"/>
  <use href="#corner-star" x="232" y="8"/>
  <use href="#corner-star" x="8" y="292"/>
  <use href="#corner-star" x="232" y="292"/>
</svg>
