<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
  <!-- Subtle 8-point-star (khatam) lattice tile. Tileable: corner stars are
       centered on tile corners so quarters join seamlessly across tiles. -->
  <defs>
    <g id="khatam">
      <rect x="-13" y="-13" width="26" height="26"/>
      <rect x="-13" y="-13" width="26" height="26" transform="rotate(45)"/>
      <circle r="2.4"/>
    </g>
  </defs>
  <use href="#khatam" x="0" y="0"/>
  <use href="#khatam" x="96" y="0"/>
  <use href="#khatam" x="0" y="96"/>
  <use href="#khatam" x="96" y="96"/>
  <use href="#khatam" x="48" y="48"/>
  <path d="M0 48h22M74 48h22M48 0v22M48 74v22"/>
</svg>
