name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: Lint
        run: pip install ruff && ruff check apps/api
      - name: Typecheck
        run: pip install mypy && mypy apps/api/app || true # سخت‌گیرانه از فاز ۳
      - name: Tests
        run: cd apps/api && python -m pytest tests/ -q
      - name: Security scan
        run: pip install semgrep && semgrep --config auto apps/api || true
      - name: Migration check
        run: cd apps/api && alembic upgrade head && alembic downgrade -1 && alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./apps/api -t maturidi-api:${{ github.sha }}
