name: CI
# نکتهٔ انتشار (v1.1.0): این workflow روی گیت‌هاب فقط وقتی اجرا می‌شود که
# مالک فایل‌های .github/workflows/* را از طریق وب گیت‌هاب آپلود کند (اپ
# پروژه اجازهٔ push آن‌ها را ندارد). پیش از آپلود، همهٔ گام‌های backend
# عیناً روی Python 3.14 محلی اجرا و سبز شده‌اند — مدرک: گزارش مأموریت v2.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Runtime evidence
        # مدرک نسخهٔ واقعی مفسر در لاگ run می‌ماند (ادعا بدون خروجی پذیرفته نیست)
        run: python --version && python -c "import sys; assert sys.version_info[:2] == (3, 14), sys.version"
      - name: Install
        run: pip install -r apps/api/requirements.txt
      - name: System fonts for PDF
        # همان فونت‌های ایمیج production (apps/api/Dockerfile): تولید PDF
        # گواهی/رسید به Noto Sans Arabic + DejaVu Sans سیستمی نیاز دارد؛
        # نبودشان روی رانر تمیز ۸ تست را قرمز کرد (Run 83).
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-dejavu-core
      - name: Lint (ruff baseline)
        # ruff در requirements.txt پین شده (0.17.1) — شمارش خطاها به نسخه
        # حساس است و نصبِ بدون پین هر بار عدد متفاوتی می‌داد (ریشهٔ اختلاف
        # ۱۱۱۸ خطای اجرای قبلی). گیت baseline: هر افزایش نسبت به
        # tools/ruff_baseline.json قرمز می‌شود؛ بدون || true و بدون ignore.
        run: python3 tools/check_ruff_baseline.py
      - name: Typecheck
        # بدهی تایپ صفر است (۱۶۳ خطا در mypy 2.4.0 → ۰؛ شرح کامل:
        # docs/audit-v2/TYPE_DEBT_BURNDOWN.md). این گام blocking است و
        # از داخل apps/api اجرا می‌شود تا mypy.ini همان‌جا discover شود.
        working-directory: apps/api
        run: mypy app
      - name: Tests
        run: cd apps/api && python -m pytest tests/ -q
      - name: Security scan
        # مسدودکننده (Track B) — semgrep تمیز است؛ هیچ || trueای پذیرفته نیست
        run: pip install semgrep && semgrep --config auto apps/api
      - name: Dependency scan
        # مسدودکننده (قرارداد §۱۳) — pip-audit روی requirements.txt پین‌شده.
        # Phase-1 (v1.1.0): هر ۸ ignore سابق حذف شد — با ارتقای Python 3.14 و
        # fastapi 0.156.4 (starlette 1.9.0) و pytest 9.1.1، اسکن کامل بدون
        # هیچ ignoreای سبز است (راستی‌آزمایی محلی: pip-audit = ۰ یافته).
        run: |
          pip install pip-audit
          pip-audit -r apps/api/requirements.txt
      - name: Migration check
        run: cd apps/api && alembic upgrade head && alembic downgrade -1 && alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Dependency audit
        # مسدودکننده برای High/Critical (قرارداد §۱۳). بعد از ارتقای
        # next 15.5.28 و next-intl 4.9.2 درخت وب advisory ندارد.
        run: npm audit --audit-level=high
      - run: npm run typecheck
      # Track 2 / §۱۳: بیلد production بدون NEXT_PUBLIC_API_URL صریح فیل می‌کند
      # (next.config.mjs) — در CI مقدار صریح dev داده می‌شود، نه fallback خاموش.
      # API_URL (سروری) هم لازم است: route handlerها هنگام collect-page-data
      # آن را می‌خوانند و بدون آن بیلد با خطای روشن فیل می‌کند (Track 3).
      # هیچ سرور واقعی‌ای در CI بالا نیست و بیلد نباید به آن وابسته باشد.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_URL: http://localhost:8000

  crm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/crm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/crm/package-lock.json
      - run: npm ci
      - name: Dependency audit
        # مسدودکننده برای High/Critical (قرارداد §۱۳). vite 6.4.4 و
        # react-router-dom 7.18.4 و esbuild 0.25+ advisoryهای قبلی را بستند.
        run: npm audit --audit-level=high
      - run: npm run typecheck
      # Track 2 / §۱۳: مثل web — VITE_API_URL صریح، نه fallback خاموش.
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  mobile:
    # FIX2-09: تا پیش از این هیچ پوشش CI برای apps/mobile نبود.
    # npm ci از lockfile خود موبایل + typecheck + اعتبارسنجی headless
    # کانفیگ Expo (expo config) — قطعی و بدون نیاز به اکانت/secret.
    # بیلد واقعی EAS در mobile.yml است و owner-gated می‌ماند.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Expo config check (headless)
        # کانفیگ نهایی اپ (app.json/app.config + پلاگین‌ها) باید بدون
        # خطا resolve شود؛ خروجی به فایل می‌رود تا در لاگ قابل‌دید باشد.
        run: |
          npx expo config --json > /tmp/expo-config.json
          node -e "const c=require('/tmp/expo-config.json'); if(!c.name) { console.error('expo config missing name'); process.exit(1); } console.log('expo config OK:', c.name, c.slug || '')"

  postgres:
    # B-03/C-04: مهاجرت + تست یکپارچهٔ pgvector روی PostgreSQL واقعی
    # (سرویس pgvector/pgvector:pg16 — همان ایمیج compose). اثبات می‌کند
    # chunk شمارهٔ ۵۰۱ (بیرون از سقف اسکن قدیمی) روی مسیر واقعی pgvector
    # قابل بازیابی است؛ در sandbox محلی این job اجرا نمی‌شود (بدون داکر)
    # و تست بدون PG_INTEGRATION_DATABASE_URL صادقانه skip می‌شود.
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: maturidi
          POSTGRES_PASSWORD: maturidi
          POSTGRES_DB: maturidi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maturidi -d maturidi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://maturidi:maturidi@localhost:5432/maturidi_test
      PG_INTEGRATION_DATABASE_URL: postgresql+asyncpg://maturidi:maturidi@localhost:5432/maturidi_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r apps/api/requirements.txt
      - name: Migrations on real PostgreSQL
        run: cd apps/api && alembic upgrade head
      - name: pgvector integration test (chunk #501)
        run: cd apps/api && python -m pytest tests/test_pgvector_integration.py -q

  docker:
    runs-on: ubuntu-latest
    # ایمیج فقط وقتی ساخته می‌شود که هر سه job پیش‌نیاز سبز باشند.
    needs: [backend, web, crm]
    steps:
      - uses: actions/checkout@v7
      - run: docker build ./apps/api -t maturidi-api:${{ github.sha }}
      # Pass 4 / B3: پیش از این فقط ایمیج API ساخته می‌شد و
      # Dockerfileهای web/crm هرگز در CI بیلد نمی‌شدند — خرابیِ
      # آن‌ها فقط موقع deploy معلوم می‌شد. حالا هر سه ایمیج با
      # همان context/argsای که compose.prod دارد ساخته می‌شوند
      # (مقادیر API_URL این‌جا فقط CI هستند، نه deploy).
      # Pass 4 follow-up (docker web build failure on run 40102129767):
      # بیلد وب بدون API_URL در collect-page-data فیل می‌کند چون
      # lib/api.ts در production بدون API_URL صریح throw می‌کند — job وب
      # در CI هر دو متغیر را می‌گذارد، پس بیلد داکر هم باید هر دو را بدهد.
      - run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 --build-arg API_URL=http://localhost:8000 -t maturidi-web:${{ github.sha }} .
      - run: docker build -f apps/crm/Dockerfile --build-arg VITE_API_URL=http://localhost:8000 -t maturidi-crm:${{ github.sha }} .
      - name: Media toolchain present in the image (B-04)
        # مدرک واقعیِ داخل ایمیج: ffmpeg/tesseract(+fas/ara/eng)/pdftoppm
        # و faster-whisper باید باشند — همان گیت app/core/media_tools.py
        run: |
          docker run --rm maturidi-api:${{ github.sha }} sh -c "
            set -e
            ffmpeg -version >/dev/null && echo 'ffmpeg OK'
            ffprobe -version >/dev/null && echo 'ffprobe OK'
            tesseract --version >/dev/null && echo 'tesseract OK'
            tesseract --list-langs 2>/dev/null | grep -qx fas && echo 'tess fas OK'
            tesseract --list-langs 2>/dev/null | grep -qx ara && echo 'tess ara OK'
            tesseract --list-langs 2>/dev/null | grep -qx eng && echo 'tess eng OK'
            pdftoppm -v 2>&1 | grep -q . && echo 'pdftoppm OK'
            python -c 'import faster_whisper; print(\"faster-whisper OK\")'
            python -c 'from app.core.media_tools import assert_media_tools_ready; assert_media_tools_ready(); print(\"media readiness gate OK\")'
          "

  # Pass 4 / B7: نگهبان استاتیک workflowها و اسکریپت‌های CI —
  # actionlint پین‌شده + shellcheck روی tools/ci/*.sh. هیچ exclusion
  # سراسری نیست؛ اگر فایلی واقعاً نیاز به استثنا داشت، همان‌جا با
  # کامنتِ دلیل‌دار (actionlint:ignore / shellcheck disable) ثبت می‌شود.
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint (pinned 1.7.7)
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color=false
      - name: shellcheck on CI scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning tools/ci/*.sh

  compose-smoke:
    # C-04: استقرار واقعیِ compose تولید با env آزمایشی + migration +
    # دود HTTP/WS. مقادیر .env.prod این job فقط CI هستند (اسرار واقعی
    # نیستند)؛ APP_ENV=production عمدی است تا fail-fast تولید هم ورزش شود.
    # اسکریپت دود داخل کانتینر api اجرا می‌شود (پورت هاست ندارد).
    # دامنه (FIX2-10 — صریح): `up -d --build api` فقط api و closure
    # وابستگی‌اش را بالا می‌آورد (postgres, redis, minio, clamav,
    # migrate) — web/crm/workerها/monitoring این‌جا ساخته یا بررسی
    # نمی‌شوند و سبز شدن این job ادعای سلامت آن‌ها نیست. دود شامل
    # آپلود زندهٔ EICAR علیه ClamAV واقعی استک هم هست (FIX2-10).
    # استثنا (Pass 4 / B4): settings هر شش worker در job backend با
    # pytest پوشش داده می‌شود (tests/test_worker_settings_pass4.py) —
    # ولی boot واقعی workerها در compose هنوز این‌جا ورزش نمی‌شود.
    name: Compose smoke (prod stack)
    runs-on: ubuntu-latest
    needs: [backend, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Write CI-only .env.prod
        run: |
          cat > .env.prod <<'EOF'
          APP_ENV=production
          POSTGRES_USER=maturidi
          POSTGRES_PASSWORD=ci-smoke-pg-pass
          POSTGRES_DB=maturidi
          REDIS_PASSWORD=ci-smoke-redis-pass
          MINIO_ROOT_USER=ci-smoke-minio
          MINIO_ROOT_PASSWORD=ci-smoke-minio-secret-0123456789ab
          DATABASE_URL=postgresql+asyncpg://maturidi:ci-smoke-pg-pass@postgres:5432/maturidi
          REDIS_URL=redis://:ci-smoke-redis-pass@redis:6379/0
          S3_ENDPOINT=http://minio:9000
          S3_ENDPOINT_PUBLIC=https://s3.ci.maturidi.invalid
          S3_ACCESS_KEY=ci-smoke-minio
          S3_SECRET_KEY=ci-smoke-minio-secret-0123456789ab
          S3_BUCKET=maturidi-media
          S3_REGION=us-east-1
          STORAGE_PROVIDER=s3
          APP_BASE_URL=https://ci.maturidi.invalid
          JWT_SECRET=ci-smoke-jwt-secret-not-for-production-0123456789
          STORAGE_SIGNING_SECRET=ci-smoke-storage-signing-secret-5f2a9c1e
          ENCRYPTION_KEY=U3gqnk6dzSGJxfCvPp4Ix0FnNdEoFcoTunvFm8ImjvQ=
          ENCRYPTION_KEY_VERSION=1
          CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:5173
          CAPTCHA_ENABLED=false
          # smoke on the 7GB CI runner: 1 worker is enough (official compose knob;
          # real production sizes itself). 4 workers + clamd OOM-killed the smoke step (exit 137, run 168).
          UVICORN_WORKERS=1
          WEB_API_URL=http://localhost:8000
          CRM_API_URL=http://localhost:8000
          GRAFANA_PASSWORD=ci-smoke-grafana
          MB_APP_DB_USER=metabase
          MB_APP_DB_PASS=ci-smoke-mb-pass
          MB_APP_DBNAME=metabase
          MB_SITE_URL=http://localhost:3001
          EOF
          echo ".env.prod written (CI-only values)"
      - name: Bring up the production stack (api + deps + migrations)
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build api
      - name: Run smoke checks inside the api container
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T api python - < tools/ci/compose_smoke.py
      - name: Dump api logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod ps || true
          echo "===== host memory / container stats (diagnosis) ====="
          free -m || true
          docker stats --no-stream || true
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 200 api migrate || true
          echo "===== clamav logs (diagnosis, audit 197efa0) ====="
          docker compose -f docker-compose.prod.yml --env-file .env.prod logs --tail 300 clamav || true
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down -v || true
