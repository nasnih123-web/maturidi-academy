services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maturidi
      POSTGRES_PASSWORD: maturidi
      POSTGRES_DB: maturidi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maturidi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    # Track B: ایمیج‌های minio/minio از Docker Hub حذف شده‌اند (سپتامبر ۲۰۲۶) —
    # همان ایمیج با digest یکسان روی quay.io منتشر می‌شود؛ latest پین نیست.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    # Dockerfile CMD یووی‌کورن --timeout-graceful-shutdown 30 دارد؛ مهلت توقف
    # کانتینر باید از آن بیشتر باشد.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # درون کانتینر باید نام سرویس‌ها (نه localhost) استفاده شود —
      # مقادیر localhost در .env.example فقط برای اجرای محلی (bootstrap) است.
      # environment بر env_file اولویت دارد.
      DATABASE_URL: postgresql+asyncpg://maturidi:maturidi@postgres:5432/maturidi
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      APP_BASE_URL: http://localhost:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/code

  # --- مانیتورینگ — فاز ۲ (لاگ JSON → Loki، متریک → Prometheus+Grafana) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

volumes:
  pgdata:
  miniodata:
  promdata:
  grafanadata:
