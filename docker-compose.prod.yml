# =============================================================================
# docker-compose.prod.yml — استقرار production آکادمی ماتریدی (فاز ۱۷)
# =============================================================================
#
# استفاده:
#   ۱) فایل محیطی production را بسازید (هرگز commit نکنید):
#        cp .env.prod.example .env.prod   # سپس مقادیر واقعی/secretها را پر کنید
#   ۲) اعتبارسنجی (بدون نیاز به docker daemon):
#        docker compose -f docker-compose.prod.yml config
#   ۳) استقرار اول:
#        docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   جزئیات کامل: docs/ops/deployment.md
#
# اصول:
# - هیچ secretای در این فایل نیست — همه از .env.prod / secrets manager می‌آیند.
# - پورت‌های دیتابیس/کش به بیرون باز نیستند (فقط شبکهٔ داخلی backend).
# - هر سرویس stateless است (به‌جز postgres/minio که volume دارند) و می‌توان
#   replicaهای api را افقی زیاد کرد — جزئیات: docs/ops/scaling-to-100k.md
# =============================================================================

name: maturidi-prod

networks:
  frontend:
  backend:

volumes:
  pgdata:
  clamavdata:
  redisdata:
  miniodata:
  promdata:
  grafanadata:
  lokidata:
  backupdata:
  metabase-pgdata:

services:
  # ---------------------------------------------------------------- Postgres
  postgres:
    # pgvector (B-03 — ADR-0026): همان نسل PG16، بدون پرش major.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-maturidi}"
      # production: WAL archiving برای RPO کمتر از ۲۴ ساعت — docs/ops/disaster-recovery.md
      # POSTGRES_INITDB_ARGS / archive_command را در صورت نیاز override کنید.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # -------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # -------------------------------------------------------------------- MinIO
  minio:
    # Track B (اصلاحیهٔ ممیزی 197efa0 — ADR-0039): رجیستری عمومی MinIO
    # (Hub و quay) برای pull ناشناس بسته است؛ ایمیج از باینری رسمیِ همان
    # release ساخته می‌شود (infra/minio/Dockerfile، با sha256 رسمی).
    build:
      context: ./infra/minio
    image: maturidi/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ----------------------------------------------------------------------- API
  # migration در سرویس یک‌بارهٔ `migrate` (پایین) اجرا می‌شود — الگوی init-job:
  # با چند replica از api دیگر race روی migration نیست؛ شکست migration یعنی
  # `migrate` با exit غیرصفر تمام می‌شود و api/workerها اصلاً بالا نمی‌آیند
  # (condition: service_completed_successfully) — یعنی deploy بلند فیل می‌کند.
  # اسکن ویروس آپلودها (C-01 — ADR-0028): clamd روی 3310 (INSTREAM)؛
  # API fail-closed است — clamav ناسالم یعنی آپلود 503، نه ردِّ بی‌صدا.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      # چک سلامت = اسکریپت رسمی خود ایمیج (clamdcheck.sh): ‏PING را با
      # newline می‌فرستد و PONG را چک می‌کند. چک دست‌نویس قبلی با
      # ‏printf بدون newline هیچ‌وقت جواب نمی‌گرفت و کانتینر برای همیشه
      # unhealthy می‌ماند — در حالی که clamd طبق لاگ CI در ~۸ ثانیه
      # بالا آمده بود (شکست‌های compose-smoke در PR #16، ممیزی 197efa0؛
      # ایمیج رسمی دیتابیس امضا را baked دارد و دانلود بوت اول فقط
      # آپدیت روزانهٔ کوچک است). پنجرهٔ زمانی پهن فقط headroom است؛
      # گیت C-01 دست نخورده: api فقط با clamav سالم بالا می‌آید.
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 120s
    networks:
      - backend

  api:
    build: ./apps/api
    restart: unless-stopped
    # production: چند worker برای بهره‌گیری از CPU (پیش‌فرض ۴؛ با vCPU تنظیم شود)
    # --proxy-headers: چون TLS در reverse proxy خارجی terminate می‌شود (§۱۵)؛
    # فقط امن است چون api:8000 فقط از شبکهٔ داخلی در دسترس است و پروکسی لبه
    # هدرهای X-Forwarded-* جعلی را strip می‌کند (docs/ops/deployment.md §۱۵).
    # چرا sh -c؟ فرم رشته‌ایِ command در compose بدون شل exec می‌شود و
    # $${UVICORN_WORKERS:-4} هیچ‌وقت باز نمی‌شد؛ uvicorn همان رشتهٔ
    # خام را می‌گرفت، خطای Usage می‌داد و کانتینر در Restarting (2)
    # می‌ماند (شاهد: CI run 168/169 روی PR #16 — api هیچ‌وقت بالا
    # نیامد و گام دود روی کانتینر در حال ری‌استارت 137 می‌خورد).
    command:
      - sh
      - -c
      - >-
        uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers $${UVICORN_WORKERS:-4} --proxy-headers
        --forwarded-allow-ips '*' --timeout-graceful-shutdown 30
    # graceful shutdown: uvicorn فرصت تخلیهٔ درخواست‌های جاری را دارد و
    # stop_grace_period باید از آن بزرگ‌تر باشد تا SIGKILL زودتر نرسد.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      CLAMAV_HOST: clamav
    expose:
      - "8000"
    # readiness روی /ready (stdlib، بدون curl) — /health فقط liveness
    # است و وابستگی‌ها را چک نمی‌کند (Pass 4 / C6).
    # workerها هلث‌چک جدا ندارند
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - backend
      - frontend

  # ------------------------------------------------- ARQ workers (صف‌های §۵)
  # هر صف worker جدا با concurrency/retry خودش (قرارداد §۵).
  # الگو: برای scale یک صف، replica اضافه کنید:
  #   docker compose -f docker-compose.prod.yml up -d --scale worker-ai=3
  x-worker: &worker
    build: ./apps/api
    restart: unless-stopped
    # ARQ هنگام SIGTERM job جاری را تمام می‌کند؛ پیش از SIGKILL مهلت بده.
    stop_grace_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      clamav: { condition: service_healthy }
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
      CLAMAV_HOST: clamav
    networks:
      - backend

  # ------------------------------------------- Migration یک‌باره (init-job §۱۰)
  # دقیقاً یک‌بار اجرا می‌شود، قبل از api و همهٔ workerها. چون فقط همین سرویس
  # `alembic upgrade head` را اجرا می‌کند، با scale افقی api هیچ raceای روی
  # migration نیست. `restart: "no"`: بعد از موفقیت، کانتینر متوقف می‌ماند.
  # شکست migration → exit غیرصفر → dependents بالا نمی‌آیند → deploy بلند فیل.
  # دستور deploy و لاگ: docs/ops/deployment.md
  migrate:
    build: ./apps/api
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }
    env_file:
      - .env.prod
    environment:
      APP_ENV: production
    command: ["alembic", "upgrade", "head"]
    networks:
      - backend

  worker-critical:
    <<: *worker
    command: ["python", "-m", "app.worker", "critical"]
  worker-ai:
    <<: *worker
    command: ["python", "-m", "app.worker", "ai"]
  worker-media:
    <<: *worker
    command: ["python", "-m", "app.worker", "media"]
  worker-telegram:
    <<: *worker
    command: ["python", "-m", "app.worker", "telegram"]
  worker-notifications:
    <<: *worker
    command: ["python", "-m", "app.worker", "notifications"]
  worker-analytics:
    <<: *worker
    command: ["python", "-m", "app.worker", "analytics"]

  # ----------------------------------------------------------------------- Web
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "${WEB_API_URL:?set WEB_API_URL (e.g. https://api.example.com)}"
    restart: unless-stopped
    depends_on:
      - api
    # Track 2 / §۱۳ — تفکیک SSR/مرورگر: کد سمت‌سرور (RSC/route handlers)
    # از API_URL (سروری، رانتایم) استفاده می‌کند؛ درون شبکهٔ compose نام
    # سرویس درست است، نه localhost و نه آدرس عمومی.
    environment:
      API_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - frontend

  # ----------------------------------------------------------------------- CRM
  crm:
    build:
      context: .
      dockerfile: ./apps/crm/Dockerfile
      # Track 2 / §۱۳: آدرس عمومی API برای باندل SPA — اجباری، بدون fallback
      args:
        VITE_API_URL: "${CRM_API_URL:?set CRM_API_URL (e.g. https://api.example.com)}"
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend

  # ------------------------------------------------------------- Metabase BI
  metabase-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${MB_APP_DB_USER:-metabase}"
      POSTGRES_PASSWORD: "${MB_APP_DB_PASS:?set MB_APP_DB_PASS}"
      POSTGRES_DB: "${MB_APP_DBNAME:-metabaseapp}"
    volumes:
      - metabase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_APP_DB_USER:-metabase}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  metabase:
    image: metabase/metabase:v0.52
    restart: unless-stopped
    depends_on:
      metabase-db: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: "${MB_APP_DBNAME:-metabaseapp}"
      MB_DB_PORT: 5432
      MB_DB_USER: "${MB_APP_DB_USER:-metabase}"
      MB_DB_PASS: "${MB_APP_DB_PASS:?set MB_APP_DB_PASS}"
      MB_DB_HOST: metabase-db
      MB_SITE_URL: "${MB_SITE_URL:-http://localhost:3001}"
      MB_SITE_NAME: "Maturidi Academy BI"
      # در production ترجیحاً read-replica را به‌عنوان دیتابیس محصول معرفی کنید:
      # (اتصال دستی در UI متابیس به هاست رپلیکا — docs/ops/scaling-to-100k.md)
    expose:
      - "3000"
    networks:
      - backend
      - frontend

  # --------------------------------------- Monitoring (فاز ۲ → production)
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose:
      - "9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    expose:
      - "3000"
    networks:
      - backend
      - frontend

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/monitoring/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    expose:
      - "3100"
    networks:
      - backend

  # m-02: شیپر لاگ کانتینرها به Loki (داشبورد خطاها)
  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./infra/monitoring/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - backend

  # m-02: متریک‌های هاست (دیسک/حافظه) برای هشدار DiskSpaceLow
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    expose:
      - "9100"
    networks:
      - backend

  # m-02: متریک‌های PostgreSQL برای داشبورد دیتابیس
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-maturidi}?sslmode=disable"
      DATA_SOURCE_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      DATA_SOURCE_PASS: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
    depends_on:
      postgres: { condition: service_healthy }
    expose:
      - "9187"
    networks:
      - backend

  # -------------------------------------------------------------------- Backup
  # m-04: بکاپ زمان‌بندی‌شده به‌جای cron هاست — همان infra/backup.sh روی
  # شبکهٔ استک، روزی یک‌بار (BACKUP_AT_UTC). خروجی در والیوم backupdata
  # می‌نشیند؛ بازیابی آزمایشی از همین خروجی: docs/ops/dr-drill.md.
  # COMPOSE_PROJECT_NAME باید با نام پروژهٔ استک اصلی یکی باشد (پیش‌فرض
  # نام پوشهٔ ریپو است) تا سرویس‌های postgres/minio پیدا شوند.
  backup:
    image: docker:27.5.1-cli
    restart: unless-stopped
    entrypoint: ["sh", "/opt/maturidi/infra/backup/entrypoint.sh"]
    environment:
      COMPOSE_FILE: docker-compose.prod.yml
      COMPOSE_PROJECT_NAME: "${COMPOSE_PROJECT_NAME:-maturidi}"
      BACKUP_DIR: /backups
      BACKUP_AT_UTC: "${BACKUP_AT_UTC:-02:00}"
      BACKUP_RUN_ON_START: "${BACKUP_RUN_ON_START:-false}"
      POSTGRES_USER: "${POSTGRES_USER:?set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-maturidi}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?set MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}"
      S3_BUCKET: "${S3_BUCKET:?set S3_BUCKET}"
    volumes:
      - ./:/opt/maturidi
      - /var/run/docker.sock:/var/run/docker.sock
      - backupdata:/backups
    networks:
      - backend
